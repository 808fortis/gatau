name: Angelica

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Iam-nishan/Jujutsu-kernel
          ref: vanilla
          path: kernel/source

      - name: Checkout Custom Repo
        uses: actions/checkout@v4
        with:
          path: custom_files
          
      - name: KernelSU (backslashxx) support
        run: |
          cd ./kernel/source && curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -

      - name: Fix defconfig
        run: |
          cp "$GITHUB_WORKSPACE/custom_files/angelica/blossom_defconfig" ./kernel/source/arch/arm64/configs/
          find ./kernel/source/ -type f -name "build.config*" -exec sed -i 's/check_defconfig//g' {} +

      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel/source/
          config: blossom_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}