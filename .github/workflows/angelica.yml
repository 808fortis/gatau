name: Build Kernel Angelica

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/steftim/kernel_xiaomi_angelica
          kernel-branch: main
          config: angelica_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/backslashxx/KernelSU
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}