name: Build Kernel Angelica

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: steftim/kernel_xiaomi_angelican
          ref: main
          path: kernel/source
      
      - name: Apply KernelSU
        working-directory: kernel/source
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s
      
      - name: Patch defconfig
        run: |
          echo "CONFIG_KSU=y" >> ./kernel/source/arch/arm64/configs/angelica_defconfig
          echo "CONFIG_KPROBES=y" >> ./kernel/source/arch/arm64/configs/angelica_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> ./kernel/source/arch/arm64/configs/angelica_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> ./kernel/source/arch/arm64/configs/angelica_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y//g' ./kernel/source/arch/arm64/configs/angelica_defconfig
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> ./kernel/arch/arm64/configs/angelica_defconfig

      - name: Fix defconfig
        run: |
          find ./kernel/source/ -type f -name "build.config*" -exec sed -i 's/check_defconfig//g' {} +

      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel/source/
          config: angelica_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
