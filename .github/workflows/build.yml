Name: Build Kernel Matrix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: "common-android12-5.10"
            susfs_branch: "gki-android12-5.10"
            susfs_patch: "50_add_susfs_in_gki-android12-5.10.patch"
            nomount_patch: "nomount_5.10_kernel_integration.patch"
            out_dir: "android12-5.10"
          - branch: "common-android13-5.10"
            susfs_branch: "gki-android13-5.10"
            susfs_patch: "50_add_susfs_in_gki-android13-5.10.patch"
            nomount_patch: "nomount_5.10_kernel_integration.patch"
            out_dir: "android13-5.10"
          - branch: "common-android13-5.15"
            susfs_branch: "gki-android13-5.15"
            susfs_patch: "50_add_susfs_in_gki-android13-5.15.patch"
            nomount_patch: "nomount_5.15_kernel_integration.patch"
            out_dir: "android13-5.15"
          - branch: "common-android14-5.15"
            susfs_branch: "gki-android14-5.15"
            susfs_patch: "50_add_susfs_in_gki-android14-5.15.patch"
            nomount_patch: "nomount_5.15_kernel_integration.patch"
            out_dir: "android13-5.15"
          - branch: "common-android14-6.1"
            susfs_branch: "gki-android14-6.1"
            susfs_patch: "50_add_susfs_in_gki-android14-6.1.patch"
            nomount_patch: "nomount_6.1_kernel_integration.patch"
            out_dir: "android14-6.1"
          - branch: "common-android15-6.6"
            susfs_branch: "gki-android15-6.6"
            susfs_patch: "50_add_susfs_in_gki-android15-6.6.patch"
            nomount_patch: "nomount_6.6_kernel_integration.patch"
            out_dir: "android15-6.6"
          - branch: "common-android16-6.12"
            susfs_branch: "gki-android16-6.12"
            susfs_patch: "50_add_susfs_in_gki-android16-6.12.patch"
            nomount_patch: "nomount_6.12_kernel_integration.patch"
            out_dir: "android16-6.12"

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Checkout Custom Repo
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Install Dependencies & Setup Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio rsync python3 python-is-python3 dwarves zip unzip patch git curl
          
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Repo Init and Sync
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ matrix.branch }} --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: Setup ReSukiSU & SuSFS & NoMount
        run: |
          cd android-kernel/common
          # ReSukiSU
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          
          # SuSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b ${{ matrix.susfs_branch }} ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          
          if [ -f "../susfs4ksu/kernel_patches/${{ matrix.susfs_patch }}" ]; then
            patch -p1 < "../susfs4ksu/kernel_patches/${{ matrix.susfs_patch }}"
          fi

          # NoMount
          git clone https://github.com/maxsteeel/nomount ../nomount
          if [ -f "../nomount/kernel/patches/${{ matrix.nomount_patch }}" ]; then
            patch -p1 < "../nomount/kernel/patches/${{ matrix.nomount_patch }}"
          fi
          cp ../nomount/kernel/src/* fs/ 2>/dev/null || true

      - name: Merge Custom Fragment
        run: |
          cd android-kernel
          FRAGMENT_FILE="$GITHUB_WORKSPACE/main_repo/fragments/custom.fragment"
          
          if [ -f "$FRAGMENT_FILE" ]; then
            echo "Merging fragment: $FRAGMENT_FILE"
            ARCH=arm64 common/scripts/kconfig/merge_config.sh -m common/arch/arm64/configs/gki_defconfig "$FRAGMENT_FILE"
            mv .config common/arch/arm64/configs/gki_defconfig
          fi

      - name: Fix defconfig
        run: |
          cd android-kernel
          find common/ -type f -name "build.config*" -exec sed -i 's/check_defconfig//g' {} +

      - name: Commit Local Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cd android-kernel/common
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "build: auto-commit local changes to avoid -dirty suffix"
          fi

      - name: Build Kernel
        run: |
          cd android-kernel
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          
          mkdir -p "$GITHUB_WORKSPACE/main_repo/anykernel3"
          find out/ -type f -name "Image" -exec cp {} "$GITHUB_WORKSPACE/main_repo/anykernel3/" \;

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AK3-${{ matrix.branch }}-ReSukiSU
          path: main_repo/anykernel3/
