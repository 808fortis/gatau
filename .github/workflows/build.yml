name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      susfs:
        description: 'Enable SuSFS'
        required: true
        type: boolean
        default: true
      nomount:
        description: 'Enable NoMount'
        required: true
        type: boolean
        default: true
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        ksu_type: [ReSukiSU, KernelSU-Next, KernelSU, KowSU]
    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Checkout Main Repo
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Install Dependencies & Setup Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio rsync python3 python-is-python3 dwarves zip unzip patch git curl
          
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Repo Init and Sync
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

      - name: Extract Kernel Version
        run: |
          cd android-kernel/common
          VERSION=$(grep "^VERSION =" Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep "^PATCHLEVEL =" Makefile | awk '{print $3}')
          SUBLEVEL=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          EXTRAVERSION=$(grep "^EXTRAVERSION =" Makefile | awk '{print $3}')
          echo "KERNEL_VERSION=$VERSION.$PATCHLEVEL.$SUBLEVEL$EXTRAVERSION" >> $GITHUB_ENV

      - name: Setup KernelSU, SuSFS, and Mount Options
        run: |
          cd android-kernel/common
          
          if [ "${{ matrix.ksu_type }}" == "ReSukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          elif [ "${{ matrix.ksu_type }}" == "KernelSU-Next" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable
          elif [ "${{ matrix.ksu_type }}" == "KernelSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          elif [ "${{ matrix.ksu_type }}" == "KowSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh" | bash -
          fi
          
          if [ "${{ github.event.inputs.susfs }}" != "false" ]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 ../susfs4ksu
            cp -r ../susfs4ksu/kernel_patches/fs/* fs/
            cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
            patch -p1 < "../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch"
          fi

          if [ "${{ github.event.inputs.nomount }}" != "false" ]; then
            git clone https://github.com/maxsteeel/nomount ../nomount
            patch -p1 < "../nomount/kernel/patches/nomount_5.10_kernel_integration.patch"
            cp -r ../nomount/kernel/src/* fs/
          fi

      - name: Merge Custom Fragment
        run: |
          cd android-kernel
          FRAGMENT_FILE="$GITHUB_WORKSPACE/main_repo/fragments/custom.fragment"
          
          if [ -f "$FRAGMENT_FILE" ]; then
            ARCH=arm64 common/scripts/kconfig/merge_config.sh -m common/arch/arm64/configs/gki_defconfig "$FRAGMENT_FILE"
            mv .config common/arch/arm64/configs/gki_defconfig
          fi

      - name: Fix defconfig
        run: |
          cd android-kernel
          find common/ -type f -name "build.config*" -exec sed -i 's/check_defconfig//g' {} +

      - name: Commit Local Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cd android-kernel/common
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "build: auto-commit local changes to avoid -dirty suffix"
          fi

      - name: Build Kernel
        run: |
          cd android-kernel
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          
          mkdir -p "$GITHUB_WORKSPACE/main_repo/anykernel3"
          find out/ -type f -name "Image" -exec cp {} "$GITHUB_WORKSPACE/main_repo/anykernel3/" \;

      - name: Package AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/main_repo/anykernel3
          zip -r9 "$GITHUB_WORKSPACE/AK3-5.10-${{ matrix.ksu_type }}.zip" ./*

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.KERNEL_VERSION }}-${{ github.run_id }}"
          name: "Kernel v${{ env.KERNEL_VERSION }}"
          body: |
            Kernel version: ${{ env.KERNEL_VERSION }}
            SuSFS: ${{ github.event.inputs.susfs || 'true' }}
            NoMount: ${{ github.event.inputs.nomount || 'true' }}
          files: AK3-5.10-${{ matrix.ksu_type }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
