name: experiment

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: realme-mediatek-dev/android_kernel_realme_mt676
          ref: android-11.0
          path: kernel/source

      - name: Checkout Custom Repo
        uses: actions/checkout@v4
        with:
          path: custom_files

      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel/source/
          config: gki_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}