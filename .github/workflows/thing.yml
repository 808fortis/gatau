name: Build Android Kernel 12-5.10

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev git repo python3 python-is-python3 libncurses-dev zip curl wget tar ccache patch

      - name: Sync Source Code
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Setup KernelSU, SUSFS, and zeromount
        run: |
          cd kernel/common
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -
          
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs
          cp -r susfs/kernel_patches/fs/* fs/
          cp -r susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 < susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          git clone https://github.com/Enginex0/zeromount.git
          if [ -f zeromount/setup.sh ]; then
            bash zeromount/setup.sh
          fi

          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

          sed -i 's/-dirty//g' scripts/setlocalversion

      - name: Disable Defconfig Check
        run: |
          cd kernel
          echo "check_defconfig() { return 0; }" >> build/build.sh
          find common/ -type f -name "build.config*" -exec sed -i 's/check_defconfig//g' {} +

      - name: Build Kernel
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Package AnyKernel3
        run: |
          SUBLEVEL=$(grep -m1 "^SUBLEVEL =" kernel/common/Makefile | awk '{print $3}')
          KERNEL_VER="5.10.${SUBLEVEL}"
          echo "KERNEL_VER=${KERNEL_VER}" >> $GITHUB_ENV

          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel
          cp kernel/out/android12-5.10/dist/Image anykernel/
          cd anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 "../GKI-android12-5.10-ReSukiSU.zip" . -x ".git*" "README.md" "*placeholder"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.KERNEL_VER }}-${{ github.run_number }}"
          name: "GKI Kernel 5.10 Build - ${{ env.KERNEL_VER }}"
          body: |
            Kernel Version: ${{ env.KERNEL_VER }}
            SuSFS: yes
            ZeroMount: yes
          files: "GKI-android12-5.10-ReSukiSU.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
