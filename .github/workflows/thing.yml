name: Build Android Kernel 12-5.10

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "KOWX712-KernelSU"
            url: "https://raw.githubusercontent.com/KOWX712/KernelSU/refs/heads/master/kernel/setup.sh"
          - name: "tiann-KernelSU"
            url: "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh"
          - name: "KernelSU-Next"
            url: "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          - name: "SukiSU-Ultra"
            url: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh"
          - name: "ReSukiSU"
            url: "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev git repo python3 python-is-python3 libncurses-dev zip curl wget tar ccache patch

      - name: Sync Source Code
        run: |
          mkdir kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Setup KernelSU, SUSFS, and zeromount
        run: |
          cd kernel/common
          curl -LSs "${{ matrix.url }}" | bash -
          
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs
          cp -r susfs/kernel_patches/fs/* fs/
          cp -r susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 < susfs/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          git clone https://github.com/Enginex0/zeromount.git
          if [ -f zeromount/setup.sh ]; then
            bash zeromount/setup.sh
          fi

          cat <<EOF >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

          sed -i 's/-dirty//g' scripts/setlocalversion

      - name: Disable Defconfig Check
        run: |
          cd kernel
          sed -i 's/check_defconfig//g' build/build.sh || true
          sed -i 's/POST_DEFCONFIG_CMDS=check_defconfig//g' common/build.config.gki.aarch64 || true

      - name: Build Kernel
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-Kernel-Image-${{ matrix.name }}
          path: kernel/out/android12-5.10/dist/Image*
